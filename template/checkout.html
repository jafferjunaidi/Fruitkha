{% extends "main.html" %}
{% block content %}	
	<!-- breadcrumb-section -->
	<div class="breadcrumb-section breadcrumb-bg">
		<div class="container">
			<div class="row">
				<div class="col-lg-8 offset-lg-2 text-center">
					<div class="breadcrumb-text">
						<p>Fresh and Organic</p>
						<h1>Check Out Product</h1>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- end breadcrumb section -->

	<!-- check out section -->
	<div class="checkout-section mt-150 mb-150">
		<div class="container">
			<div class="row">
				<div class="col-lg-8">
					<div class="checkout-accordion-wrap">
						<div class="accordion" id="accordionExample">
						  <div class="card single-accordion">
						    <div class="card-header" id="headingOne">
						      <h5 class="mb-0">
						        <button class="btn btn-link" type="button" data-toggle="collapse" data-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
						          Billing Address
						        </button>
						      </h5>
						    </div>

						    <div id="collapseOne" class="collapse show" aria-labelledby="headingOne" data-parent="#accordionExample">
						      <div class="card-body">
						        <div class="billing-address-form">
						        	<form action="">
						        		<p><input type="text" placeholder="Name"></p>
						        		<p><input type="email" placeholder="Email"></p>
						        		<p><input type="text" placeholder="Address"></p>
						        		<p><input type="number" placeholder="Phone"></p>
						        		<p><textarea name="bill" id="bill" cols="30" rows="10" placeholder="Wan't To Say Something?"></textarea></p>
						        	</form>
						        </div>
						      </div>
						    </div>
						  </div>

						  <div class="card single-accordion">
						    <div class="card-header" id="headingTwo">
						      <h5 class="mb-0">
						        <button class="btn btn-link collapsed" type="button" data-toggle="collapse" data-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
						          Shipping Address
						        </button>
						      </h5>
						    </div>
						    <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordionExample">
						      <div class="card-body">
						        <div class="shipping-address-form">

                                    <div class="billing-address-form">
						        	<form action="">
						        		<p><input type="text" placeholder="Name" required></p>
						        		<p><input type="text" placeholder="City" required class="mt-3"></p>
						        		<p>
											<select id="country" name="country" required style="padding: 8px;" class="mt-3">
                                            <option value="" selected hidden>Select Country</option>
                                            <option value="Pakistan">Pakistan</option>
                                            <option value="United States">United States</option>
                                            <option value="United Kingdom">United Kingdom</option>
                                            <option value="Canada">Canada</option>
      										</select>
										</p>
						        		<p><input type="text" placeholder="Street Address" required class="mt-3"></p>
						        		<p><input type="text" placeholder="Postal Code" required class="mt-3"></p>
						        		<p><input type="number" placeholder="Phone Number" required class="mt-3"></p>
						        	</form>
						        </div>

						        </div>
						      </div>
						    </div>
						  </div>

						  <div class="card single-accordion">
						    <div class="card-header" id="headingThree">
						      <h5 class="mb-0">
						        <button class="btn btn-link collapsed" type="button" data-toggle="collapse" data-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
						          Card Details
						        </button>
						      </h5>
						    </div>
						    <div id="collapseThree" class="collapse" aria-labelledby="headingThree" data-parent="#accordionExample">
						      <div class="card-body">
						        <div class="card-details">

						        	<form action="">
						        		<p>
										<input type="text" placeholder="Card Holder Name" required>
						        		<input type="text" placeholder="Card Number" required class="mt-3">
										</p>
										<div class="expiry-group mt-3">
        								<p>
										<input type="text" placeholder="MM" maxlength="2" pattern="\d{2}" required>
        								<input type="text" placeholder="YY" maxlength="2" pattern="\d{2}" required>
										</p>
      									</div>
						        		<p><input type="number" placeholder="CVV" required class="mt-3"></p>
						        		<input type="submit" value="Proceed to Payment" class="mt-2">
						        	</form>

						        </div>
						      </div>
						    </div>
						  </div>
						</div>

					</div>
				</div>

				<div class="col-lg-4">
					<div class="order-details-wrap">
						<table class="order-details">
							<thead>
								<tr>
									<th>Order Details</th>
									<th>Price</th>
								</tr>
							</thead>
							<tbody class="order-details-body">
								<tr>
									<td>Products</td>
									<td>Total</td>
								</tr>
								<tr>
									<td>Strawberry</td>
									<td>$85.00</td>
								</tr>
								<tr>
									<td>Lemon</td>
									<td>$35.00</td>
								</tr>
								<tr>
									<td>Kiwi</td>
									<td>$50.00</td>
								</tr>
							</tbody>
							<tbody class="checkout-details">
								<tr>
									<td>Subtotal</td>
									<td>$170</td>
								</tr>
								<tr>
									<td>Shipping</td>
									<td>$50</td>
								</tr>
								<tr>
									<td>Total</td>
									<td>$220</td>
								</tr>
							</tbody>
						</table>
						<a href="/cart" class="boxed-btn">Place Order</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- end check out section -->

	<!-- logo carousel -->
	<div class="logo-carousel-section">
		<div class="container">
			<div class="row">
				<div class="col-lg-12">
					<div class="logo-carousel-inner">
						<div class="single-logo-item">
							<img src="/static/assets/img/company-logos/1.png" alt="">
						</div>
						<div class="single-logo-item">
							<img src="/static/assets/img/company-logos/2.png" alt="">
						</div>
						<div class="single-logo-item">
							<img src="/static/assets/img/company-logos/3.png" alt="">
						</div>
						<div class="single-logo-item">
							<img src="/static/assets/img/company-logos/4.png" alt="">
						</div>
						<div class="single-logo-item">
							<img src="/static/assets/img/company-logos/5.png" alt="">
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- end logo carousel -->
 {% endblock %}
